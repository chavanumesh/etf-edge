name: Price Tracker Cron

on:
  schedule:
    - cron: '0 */6 * * *'  # Runs every 6 hours
  workflow_dispatch:       # Allows manual trigger button

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        working-directory: price-tracker
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Execute Scraper Routine
        working-directory: price-tracker
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Commit Updated Database
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add price-tracker/tracker.db
          git diff --staged --quiet || git commit -m "Updated price history"
          git push
