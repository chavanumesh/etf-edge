<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inbox Assistant</title>
<style>
  :root{
    --ink:#1b2430;
    --paper:#f6f4ef;
    --line:#dcd7cb;
    --accent:#2f5d50;
    --accent-soft:#e4ede9;
    --warn:#a14e3a;
    --warn-soft:#f5e6e0;
    --muted:#7a7469;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:680px;margin:0 auto;padding:24px 18px 60px;}
  header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px;}
  h1{font-size:22px;letter-spacing:-0.01em;margin:0;font-weight:700;}
  .sub{font-size:12px;color:var(--muted);margin-top:2px;}
  button#runBtn{
    background:var(--accent);color:#fff;border:none;border-radius:10px;
    padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer;
  }
  button#runBtn:disabled{opacity:0.6;}
  .range-row{display:flex;gap:8px;margin-bottom:12px;}
  #rangeSelect{
    flex:1;padding:10px 12px;border-radius:10px;border:1px solid var(--line);
    background:#fff;font-size:14px;color:var(--ink);
  }
  #searchBox{
    width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);
    background:#fff;font-size:14px;color:var(--ink);margin-bottom:18px;
  }
  .digest{
    background:var(--accent-soft);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px 18px;
    margin-bottom:22px;
    font-size:14.5px;
    line-height:1.5;
  }
  .digest .label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:700;margin-bottom:6px;}
  .autofiled{
    background:#fff;border:1px dashed var(--accent);border-radius:10px;
    padding:10px 14px;margin-bottom:22px;font-size:12.5px;color:var(--accent);
  }
  .section-title{
    font-size:13px;text-transform:uppercase;letter-spacing:.08em;
    color:var(--muted);font-weight:700;margin:26px 0 10px;
  }
  .card{
    background:#fff;border:1px solid var(--line);border-radius:12px;
    padding:14px 16px;margin-bottom:10px;
    transition:opacity 0.25s ease;
  }
  .card.important{border-color:var(--warn);background:var(--warn-soft);}
  .card.moving{opacity:0.4;}
  .card .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;}
  .card .from{font-size:12.5px;color:var(--muted);}
  .card .subject{font-size:14.5px;font-weight:600;margin-top:2px;line-height:1.3;}
  .card .reason{font-size:12.5px;color:var(--muted);margin-top:6px;}
  .tag{
    font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
    padding:3px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);
    white-space:nowrap;
  }
  .move-row{display:flex;gap:6px;margin-top:10px;}
  .move-row select{
    flex:1;font-size:12.5px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:#fff;
  }
  .move-row button{
    font-size:12.5px;padding:6px 12px;border-radius:8px;border:1px solid var(--accent);
    background:#fff;color:var(--accent);font-weight:600;cursor:pointer;white-space:nowrap;
  }
  .move-row button:disabled{opacity:0.5;}
  .move-status{font-size:11.5px;color:var(--accent);margin-top:6px;}
  .remember-row{
    display:flex;align-items:center;gap:6px;margin-top:8px;
    font-size:11.5px;color:var(--muted);
  }
  .cat-group{margin-bottom:18px;}
  .cat-head{font-size:14px;font-weight:700;margin-bottom:8px;}
  .empty, .loading, .error{text-align:center;color:var(--muted);padding:60px 10px;font-size:14px;}
  .error{color:var(--warn);}
  .spinner{
    width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--accent);
    border-radius:50%;margin:0 auto 12px;animation:spin 0.8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Inbox Assistant</h1>
      <div class="sub" id="statusLine">Choose a range and tap Run</div>
    </div>
    <button id="runBtn" onclick="runScan()">Run</button>
  </header>

  <div class="range-row">
    <select id="rangeSelect">
      <option value="1">Today</option>
      <option value="7">Last 7 days</option>
      <option value="15" selected>Last 15 days</option>
      <option value="30">Last 30 days</option>
      <option value="60">Last 60 days</option>
      <option value="90">Last 90 days</option>
    </select>
  </div>
  <input id="searchBox" type="text" placeholder="Search by sender or subject..." oninput="applyFilter()">

  <div id="content"></div>
</div>

<script>
const WORKER_URL = "https://email-assistant.chavan-umesh.workers.dev/";
let lastData = null;
let folderList = [];
let uidToItem = {};

fetch(WORKER_URL + "?action=folders").then(r => r.json()).then(d => {
  folderList = d.folders || [];
}).catch(() => {});

function extractEmail(fromStr){
  const m = (fromStr || "").match(/<([^>]+)>/);
  if (m) return m[1].trim();
  const m2 = (fromStr || "").match(/[\w.+-]+@[\w-]+\.[\w.-]+/);
  return m2 ? m2[0].trim() : "";
}

async function runScan(){
  const btn = document.getElementById('runBtn');
  const content = document.getElementById('content');
  const status = document.getElementById('statusLine');
  const days = document.getElementById('rangeSelect').value;
  btn.disabled = true;
  status.textContent = "Scanning...";
  content.innerHTML = `<div class="loading"><div class="spinner"></div>Reading your inbox and analyzing emails...</div>`;

  try {
    const res = await fetch(WORKER_URL + "?days=" + days);
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    lastData = data;
    (data.items || []).forEach(i => uidToItem[i.uid] = i);
    document.getElementById('searchBox').value = "";
    render(data);
    let statusText = "Last run: " + new Date().toLocaleString();
    if (data.totalFound && data.analyzed && data.totalFound > data.analyzed) {
      statusText += ` — showing ${data.analyzed} of ${data.totalFound} found. Narrow the range or run again to see more.`;
    }
    status.textContent = statusText;
  } catch (e) {
    content.innerHTML = `<div class="error">Something went wrong: ${escapeHtml(e.message)}</div>`;
    status.textContent = "Run failed";
  } finally {
    btn.disabled = false;
  }
}

function applyFilter(){
  if (!lastData) return;
  const q = document.getElementById('searchBox').value.trim().toLowerCase();
  if (!q) { render(lastData); return; }
  const filtered = {
    ...lastData,
    items: (lastData.items || []).filter(i =>
      (i.from || "").toLowerCase().includes(q) ||
      (i.subject || "").toLowerCase().includes(q) ||
      (i.category || "").toLowerCase().includes(q)
    )
  };
  render(filtered, true);
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function render(data, isFiltered){
  const items = data.items || [];
  const content = document.getElementById('content');

  if (!items.length) {
    content.innerHTML = isFiltered
      ? `<div class="empty">No emails match your search.</div>`
      : `<div class="digest"><div class="label">Digest</div>${escapeHtml(data.digest || "No emails found.")}</div>`;
    return;
  }

  let html = "";
  if (!isFiltered) {
    html += `<div class="digest"><div class="label">Digest</div>${escapeHtml(data.digest || "")}</div>`;
    if (data.autoFiled && data.autoFiled.length) {
      const byFolder = {};
      data.autoFiled.forEach(f => { byFolder[f.folder] = (byFolder[f.folder]||0)+1; });
      const summary = Object.entries(byFolder).map(([f,c]) => `${c} to ${f}`).join(", ");
      html += `<div class="autofiled">Auto-filed ${data.autoFiled.length} email${data.autoFiled.length>1?'s':''} based on your rules (${summary})</div>`;
    }
  }

  const important = items.filter(i => i.important);
  if (important.length){
    html += `<div class="section-title">Flagged Important</div>`;
    important.forEach(i => html += cardHtml(i, true));
  }

  const byCategory = {};
  items.forEach(i => {
    const c = i.category || "Other";
    if (!byCategory[c]) byCategory[c] = [];
    byCategory[c].push(i);
  });

  html += `<div class="section-title">${isFiltered ? "Matching Emails" : "All Emails by Category"}</div>`;
  Object.keys(byCategory).sort().forEach(cat => {
    html += `<div class="cat-group"><div class="cat-head">${escapeHtml(cat)} (${byCategory[cat].length})</div>`;
    byCategory[cat].forEach(i => html += cardHtml(i, false));
    html += `</div>`;
  });

  content.innerHTML = html;
}

function folderOptions(){
  if (!folderList.length) return `<option value="">Loading folders...</option>`;
  return `<option value="">Move to...</option>` +
    folderList.map(f => `<option value="${escapeHtml(f)}">${escapeHtml(f)}</option>`).join("");
}

function cardHtml(i, importantStyle){
  const cardId = "card-" + i.uid;
  return `<div class="card${importantStyle ? ' important' : ''}" id="${cardId}">
    <div class="top">
      <div>
        <div class="from">${escapeHtml(i.from || "")}</div>
        <div class="subject">${escapeHtml(i.subject || "(no subject)")}</div>
      </div>
      <div class="tag">${escapeHtml(i.category || "Other")}</div>
    </div>
    ${i.reason ? `<div class="reason">${escapeHtml(i.reason)}</div>` : ""}
    <div class="move-row">
      <select id="folder-${i.uid}">${folderOptions()}</select>
      <button onclick="moveCard('${i.uid}')">Move</button>
    </div>
    <label class="remember-row">
      <input type="checkbox" id="remember-${i.uid}" checked>
      Always move emails from this sender here
    </label>
    <div class="move-status" id="status-${i.uid}"></div>
  </div>`;
}

async function moveCard(uid){
  const select = document.getElementById('folder-' + uid);
  const folder = select.value;
  const statusEl = document.getElementById('status-' + uid);
  const card = document.getElementById('card-' + uid);
  const remember = document.getElementById('remember-' + uid).checked;
  const item = uidToItem[uid];
  const senderEmail = item ? extractEmail(item.from) : "";
  if (!folder) { statusEl.textContent = "Pick a folder first."; return; }

  card.classList.add('moving');
  statusEl.textContent = "Moving...";
  try {
    let url = WORKER_URL + `?action=move&uid=${encodeURIComponent(uid)}&folder=${encodeURIComponent(folder)}`;
    if (senderEmail) url += `&sender=${encodeURIComponent(senderEmail)}&remember=${remember}`;
    const res = await fetch(url);
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    statusEl.textContent = remember && senderEmail
      ? `Moved to ${folder} — future emails from this sender will auto-file here`
      : `Moved to ${folder}`;
    setTimeout(() => { card.style.display = "none"; }, 900);
  } catch (e) {
    card.classList.remove('moving');
    statusEl.textContent = "Move failed: " + e.message;
  }
}
</script>
</body>
</html>
