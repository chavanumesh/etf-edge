<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocal Practice Hub</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #8b5cf6;
            --primary-hover: #7c3aed;
            --accent: #10b981;
            --danger: #ef4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 10px;
        }

        h1 { margin: 0; font-size: 2rem; color: var(--text-color); }
        p { margin: 5px 0 0; color: var(--text-muted); }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
            font-size: 1rem;
        }

        .btn:hover { background-color: var(--primary-hover); }
        .btn:disabled { background-color: var(--text-muted); cursor: not-allowed; }
        .btn-danger { background-color: var(--danger); }
        .btn-danger:hover { background-color: #dc2626; }
        .btn-accent { background-color: var(--accent); }
        .btn-accent:hover { background-color: #059669; }

        .flex-group {
            display: flex;
            gap: 10px;
        }

        .timer-display {
            font-size: 2.5rem;
            font-weight: 700;
            text-align: center;
            font-family: monospace;
            margin: 10px 0;
        }

        audio {
            width: 100%;
            margin-top: 15px;
            border-radius: 8px;
        }

        textarea {
            width: 100%;
            height: 80px;
            background-color: var(--bg-color);
            border: 1px solid #334155;
            border-radius: 8px;
            color: var(--text-color);
            padding: 10px;
            box-sizing: border-box;
            resize: none;
            margin-bottom: 10px;
            font-family: inherit;
        }

        .log-list {
            margin-top: 15px;
            max-height: 200px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .log-item {
            background: rgba(255,255,255,0.03);
            padding: 10px;
            border-radius: 6px;
            border-left: 4px solid var(--primary);
            font-size: 0.9rem;
        }

        .log-date {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Vocal Practice Hub</h1>
        <p>Your free browser-based singing sandbox</p>
    </header>

    <div class="card">
        <div class="card-title">⏱️ Session Timer</div>
        <div class="timer-display" id="timer">00:00</div>
        <div class="flex-group">
            <button class="btn" id="startTimerBtn" onclick="toggleTimer()">Start Session</button>
            <button class="btn btn-danger" onclick="resetTimer()">Reset</button>
        </div>
    </div>

    <div class="card">
        <div class="card-title">🎵 Pitch Pipe (Reference Note)</div>
        <p style="font-size:0.85rem; margin-bottom:10px;">Listen to a clean Middle C (261.63 Hz) tone to anchor your pitch.</p>
        <button class="btn btn-accent" id="pitchBtn" onmousedown="playPitch()" onmouseup="stopPitch()" ontouchstart="playPitch()" ontouchend="stopPitch()">Hold to Play Middle C</button>
    </div>

    <div class="card">
        <div class="card-title">🎙️ Self-Audit Recorder</div>
        <button class="btn" id="recordBtn" onclick="toggleRecording()">Record My Voice</button>
        <audio id="audioPlayback" controls style="display:none;"></audio>
    </div>

    <div class="card">
        <div class="card-title">📝 Practice Journal</div>
        <textarea id="journalInput" placeholder="Note your pitch accuracy, breathing struggles, or dynamic control changes here..."></textarea>
        <button class="btn" onclick="saveLog()">Save Entry</button>
        <div class="log-list" id="logList"></div>
    </div>
</div>

<script>
    let timerInterval;
    let seconds = 0;
    let timerRunning = false;

    function toggleTimer() {
        const btn = document.getElementById('startTimerBtn');
        if (!timerRunning) {
            timerRunning = true;
            btn.textContent = "Pause Session";
            btn.style.backgroundColor = "#eab308";
            timerInterval = setInterval(() => {
                seconds++;
                let mins = Math.floor(seconds / 60).toString().padStart(2, '0');
                let secs = (seconds % 60).toString().padStart(2, '0');
                document.getElementById('timer').textContent = `${mins}:${secs}`;
            }, 1000);
        } else {
            clearInterval(timerInterval);
            timerRunning = false;
            btn.textContent = "Resume Session";
            btn.style.backgroundColor = "var(--primary)";
        }
    }

    function resetTimer() {
        clearInterval(timerInterval);
        timerRunning = false;
        seconds = 0;
        document.getElementById('timer').textContent = "00:00";
        const btn = document.getElementById('startTimerBtn');
        btn.textContent = "Start Session";
        btn.style.backgroundColor = "var(--primary)";
    }

    let audioCtx;
    let oscillator;

    function playPitch() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        oscillator = audioCtx.createOscillator();
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(261.63, audioCtx.currentTime);
        oscillator.connect(audioCtx.destination);
        oscillator.start();
    }

    function stopPitch() {
        if (oscillator) {
            oscillator.stop();
            oscillator.disconnect();
        }
    }

    let mediaRecorder;
    let audioChunks = [];
    let isRecording = false;

    async function toggleRecording() {
        const recordBtn = document.getElementById('recordBtn');

        if (!isRecording) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = event => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                    const audioUrl = URL.createObjectURL(audioBlob);
                    const audioPlayback = document.getElementById('audioPlayback');
                    audioPlayback.src = audioUrl;
                    audioPlayback.style.display = 'block';
                };

                mediaRecorder.start();
                isRecording = true;
                recordBtn.textContent = "⏹️ Stop Recording";
                recordBtn.classList.add('btn-danger');
            } catch (err) {
                alert("Microphone access denied or unsupported on this device.");
            }
        } else {
            mediaRecorder.stop();
            isRecording = false;
            recordBtn.textContent = "🎙️ Record My Voice";
            recordBtn.classList.remove('btn-danger');
        }
    }

    function displayLogs() {
        const logList = document.getElementById('logList');
        logList.innerHTML = '';
        const logs = JSON.parse(localStorage.getItem('vocalLogs') || '[]');

        logs.reverse().forEach(log => {
            const item = document.createElement('div');
            item.className = 'log-item';
            item.innerHTML = `<div class="log-date">${log.date}</div><div>${log.text}</div>`;
            logList.appendChild(item);
        });
    }

    function saveLog() {
        const input = document.getElementById('journalInput');
        const text = input.value.trim();
        if (!text) return;

        const logs = JSON.parse(localStorage.getItem('vocalLogs') || '[]');
        const newLog = {
            text: text,
            date: new Date().toLocaleString()
        };

        logs.push(newLog);
        localStorage.setItem('vocalLogs', JSON.stringify(logs));
        input.value = '';
        displayLogs();
    }

    window.onload = displayLogs;
</script>

</body>
</html>
